<!doctype html>
<html>
  <head>
    <title>Student Cards</title>
    <style>
      body {
        font-family: Arial;
        background: #eef2f7;
        padding: 20px;
        text-align: center;
      }

      h1 {
        margin-bottom: 20px;
      }

      .form {
        background: white;
        padding: 15px;
        border-radius: 10px;
        display: inline-block;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        margin-bottom: 20px;
      }

      .form input {
        display: block;
        margin: 10px 0;
        padding: 10px;
        width: 250px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      .form button {
        padding: 10px;
        width: 100%;
        border: none;
        background: #28a745;
        color: white;
        border-radius: 5px;
        cursor: pointer;
      }

      .form button:hover {
        background: #218838;
      }

      .container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
      }

      .card {
        background: white;
        width: 250px;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
        text-align: left;
        position: relative;
      }

      .card h3 {
        margin: 0 0 10px;
        color: #333;
      }

      .card p {
        margin: 5px 0;
        color: #555;
      }

      .delete-btn {
        position: absolute;
        top: 8px;
        right: 10px;
        background: red;
        color: white;
        border: none;
        border-radius: 50%;
        width: 25px;
        height: 25px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Student Card Manager</h1>

    <div class="form">
      <input id="name" placeholder="Enter Name" />
      <input id="email" placeholder="Enter Email" />
      <input id="phone" placeholder="Enter Phone" />
      <input id="course" placeholder="Enter Course" />
      <button onclick="addCard()">Add Student</button>
    </div>

    <div id="container" class="container"></div>

    <script>
      let cards = JSON.parse(localStorage.getItem("students")) || [];

      function addCard() {
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const course = document.getElementById("course").value.trim();

        if (!name || !email || !phone || !course) {
          alert("Please fill all fields");
          return;
        }
        let alreadyExists = cards.some((student) => student.email === email);

        if (alreadyExists) {
          alert("Student with this email already exists");
          return;
        }

        const student = { name, email, phone, course };

        cards.push(student);
        saveData();
        renderCards();

        document.getElementById("name").value = "";
        document.getElementById("email").value = "";
        document.getElementById("phone").value = "";
        document.getElementById("course").value = "";
      }

      function deleteCard(index) {
        cards.splice(index, 1);
        saveData();
        renderCards();
      }

      function saveData() {
        localStorage.setItem("students", JSON.stringify(cards));
      }

      function renderCards() {
        const container = document.getElementById("container");
        container.innerHTML = "";

        cards.forEach((student, index) => {
          const div = document.createElement("div");
          div.className = "card";

          div.innerHTML = `
          <button class="delete-btn" onclick="deleteCard(${index})">x</button>
          <h3>${student.name}</h3>
          <p><b>Email:</b> ${student.email}</p>
          <p><b>Phone:</b> ${student.phone}</p>
          <p><b>Course:</b> ${student.course}</p>
        `;

          container.appendChild(div);
        });
      }

      renderCards();
    </script>
  </body>
</html>
